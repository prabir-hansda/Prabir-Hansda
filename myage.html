<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A live age tracker for Prabir Hansda."><title>Prabir Hansda — My Age</title><style>:root{--bg:#050505;--surface:#0d0d0f;--text:#f5f5f5;--muted:#99999f;--line:#29292d;--accent:#fff;--accent2:#aaa}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0,#1b1b1f 0,transparent 34%),var(--bg)}.wrap{width:min(900px,calc(100% - 32px));margin:auto}header{padding:24px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #171719}a{color:inherit}.brand,.back{text-decoration:none;font-weight:850}.back{color:var(--muted);font-size:14px}main{padding:70px 0 90px}.intro{text-align:center;margin-bottom:34px}.eyebrow{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#c8c8cd;background:#0b0b0c;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.14em}h1{font-size:clamp(44px,7vw,70px);letter-spacing:-.07em;margin:18px 0 10px}.intro p{color:var(--muted);margin:0}.age-card{background:linear-gradient(145deg,#111113,#09090a);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 30px 80px rgba(0,0,0,.5)}.age-number{text-align:center;padding:34px 18px;border-radius:22px;background:#f5f5f5;color:#080808;box-shadow:0 15px 35px rgba(0,0,0,.3)}#years{display:block;font-size:clamp(76px,14vw,132px);line-height:.9;font-weight:950;letter-spacing:-.09em}.label{margin-top:14px;font-weight:750;color:#555}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.stat{padding:20px 12px;text-align:center;border:1px solid var(--line);border-radius:17px;background:#0d0d0f}.value{display:block;font-size:clamp(25px,4vw,38px);font-weight:850;letter-spacing:-.04em}.unit{color:#77777e;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.progress{margin-top:20px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:8px;background:#252529;border-radius:99px;overflow:hidden}#fill{height:100%;width:0;border-radius:inherit;background:#fff;transition:width .5s linear}.actions{display:flex;justify-content:center;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid var(--line);background:#151517;transition:.2s}.button:hover{background:#fff;color:#050505}.note{text-align:center;color:#777;font-size:13px;margin-top:22px}@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}main{padding-top:45px}}</style></head><body><div class="wrap"><header><a class="brand" href="index.html">PH.</a><a class="back" href="index.html">← Back home</a></header><main><div class="intro"><span class="eyebrow">Live age tracker</span><h1>How old am I?</h1><p>My age updates automatically in real time.</p></div><section class="age-card" aria-label="Live age information"><div class="age-number"><span id="years">00</span><span class="label">years old</span></div><div class="stats"><div class="stat"><span id="months" class="value">0</span><span class="unit">months</span></div><div class="stat"><span id="days" class="value">0</span><span class="unit">days</span></div><div class="stat"><span id="hours" class="value">00</span><span class="unit">hours</span></div><div class="stat"><span id="minutes" class="value">00</span><span class="unit">minutes</span></div></div><div class="progress"><div class="progress-head"><span>Current minute</span><span id="secondsLabel">0%</span></div><div class="track"><div id="fill"></div></div></div><div class="actions"><a class="button" href="index.html">Return to profile</a></div><p class="note">Birthday: 22 August 2004 · 1:30 PM</p></section></main></div><script>const BIRTH_DATE=new Date(2004,7,22,13,30,0),$=id=>document.getElementById(id);function ageParts(now){let years=now.getFullYear()-BIRTH_DATE.getFullYear(),months=now.getMonth()-BIRTH_DATE.getMonth(),anchor=new Date(now.getFullYear(),now.getMonth(),BIRTH_DATE.getDate(),BIRTH_DATE.getHours(),BIRTH_DATE.getMinutes(),BIRTH_DATE.getSeconds());if(anchor>now)months--;if(months<0){years--;months+=12}const birthday=new Date(now.getFullYear(),BIRTH_DATE.getMonth(),BIRTH_DATE.getDate(),BIRTH_DATE.getHours(),BIRTH_DATE.getMinutes(),BIRTH_DATE.getSeconds());const last=birthday>now?new Date(now.getFullYear()-1,BIRTH_DATE.getMonth(),BIRTH_DATE.getDate(),BIRTH_DATE.getHours(),BIRTH_DATE.getMinutes(),BIRTH_DATE.getSeconds()):birthday;let r=now-last,day=Math.floor(r/86400000);r%=86400000;let hour=Math.floor(r/3600000);r%=3600000;let minute=Math.floor(r/60000);return{years,months,day,hour,minute}}function update(){const now=new Date(),a=ageParts(now);$('years').textContent=a.years;$('months').textContent=a.months;$('days').textContent=a.day;$('hours').textContent=String(a.hour).padStart(2,'0');$('minutes').textContent=String(a.minute).padStart(2,'0');const pct=now.getSeconds()/60*100;$('fill').style.width=pct+'%';$('secondsLabel').textContent=Math.floor(pct)+'%'}update();setInterval(update,1000)</script></body></html>
