<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prabir Hansda — My Age</title><style>:root{--bg:#030303;--panel:#0d0d0f;--text:#fff;--muted:#999;--line:#29292d;--accent:#fff}html[data-theme=light]{--bg:#f7f7f7;--panel:#fff;--text:#090909;--muted:#666;--line:#ddd;--accent:#090909}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 50% 0,#252529 0,transparent 34%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;transition:.4s;overflow-x:hidden;padding-bottom:110px}.wrap{width:min(920px,calc(100% - 48px));margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;animation:down .7s both}.brand,.back{text-decoration:none;font-weight:900}.back{color:var(--muted);font-size:14px}.right{display:flex;align-items:center;gap:16px}.switch{display:flex;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.switch button{border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}.switch button.active{background:var(--accent);color:var(--bg)}main{padding:clamp(48px,8vw,80px) 0 90px}.intro{text-align:center;animation:up .8s both}.eyebrow{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--panel);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.intro h1{font-size:clamp(44px,7vw,70px);letter-spacing:-.07em;margin:18px 0 10px;line-height:.95}.intro p{color:var(--muted);margin:0}.age-card{margin-top:34px;background:linear-gradient(145deg,var(--panel),var(--bg));border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 30px 80px #0008;animation:card .9s .15s both}.age-number{text-align:center;padding:clamp(30px,5vw,40px) 18px;border-radius:22px;background:var(--accent);color:var(--bg);box-shadow:0 15px 35px #0005;animation:pulse 4s ease-in-out infinite}.age-number #years{display:block;font-size:clamp(72px,14vw,132px);line-height:.88;font-weight:950;letter-spacing:-.09em}.label{display:block;margin-top:14px;font-weight:750;opacity:.65}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:15px}.stat{padding:20px 10px;text-align:center;border:1px solid var(--line);border-radius:17px;background:var(--panel);transition:.3s;animation:up .7s both}.stat:nth-child(1){animation-delay:.25s}.stat:nth-child(2){animation-delay:.35s}.stat:nth-child(3){animation-delay:.45s}.stat:nth-child(4){animation-delay:.55s}.stat:hover{transform:translateY(-5px);border-color:var(--muted)}.value{display:block;font-size:clamp(24px,4vw,38px);font-weight:850}.unit{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.progress{margin-top:20px}.progress-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}#fill{height:100%;width:0;background:var(--accent);transition:width .5s linear}.actions{text-align:center;margin-top:28px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;font-weight:800;transition:.25s}.button:hover{background:var(--accent);color:var(--bg);transform:translateY(-3px)}.note{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes card{from{opacity:0;transform:translateY(35px) scale(.97)}to{opacity:1;transform:none}}@keyframes down{from{opacity:0;transform:translateY(-15px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{box-shadow:0 15px 35px #0005}50%{box-shadow:0 18px 48px #fff1}}@media(max-width:700px){.wrap{width:min(100% - 28px,560px)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.age-card{margin-top:28px}}@media(max-width:480px){header{padding:16px 0}.back{display:none}.right{gap:0}.switch button{padding:7px 9px}main{padding:42px 0 60px}.intro h1{font-size:clamp(40px,12vw,55px)}.intro p{font-size:14px;line-height:1.5}.age-card{padding:16px;border-radius:22px}.age-number{padding:28px 12px;border-radius:18px}.age-number #years{font-size:clamp(68px,21vw,100px)}.stats{gap:9px}.stat{padding:17px 7px;border-radius:14px}.value{font-size:clamp(23px,8vw,32px)}.unit{font-size:9px}.button{width:100%}.note{font-size:12px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><header><a class="brand" href="index.html">PH.</a><div class="right"><a class="back" href="index.html">← Back home</a><div class="switch"><button id="dark" onclick="theme('dark')">Black</button><button id="light" onclick="theme('light')">White</button></div></div></header><main><div class="intro"><span class="eyebrow">Live age tracker</span><h1>How old am I?</h1><p>My age updates automatically in real time.</p></div><section class="age-card" aria-label="Live age information"><div class="age-number"><span id="years">00</span><span class="label">years old</span></div><div class="stats"><div class="stat"><span id="months" class="value">0</span><span class="unit">months</span></div><div class="stat"><span id="days" class="value">0</span><span class="unit">days</span></div><div class="stat"><span id="hours" class="value">00</span><span class="unit">hours</span></div><div class="stat"><span id="minutes" class="value">00</span><span class="unit">minutes</span></div></div><div class="progress"><div class="progress-head"><span>Current minute</span><span id="secondsLabel">0%</span></div><div class="track"><div id="fill"></div></div></div><div class="actions"><a class="button" href="index.html">Return to profile</a></div><p class="note">Birthday: 22 August 2004 · 1:30 PM</p></section></main></div><script>function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);dark.classList.toggle('active',t==='dark');light.classList.toggle('active',t==='light')}theme(localStorage.getItem('theme')||'dark');const BIRTH_DATE=new Date(2004,7,22,13,30,0),$=id=>document.getElementById(id);function update(){const now=new Date();let years=now.getFullYear()-2004,months=now.getMonth()-7,anchor=new Date(now.getFullYear(),now.getMonth(),22,13,30);if(anchor>now)months--;if(months<0){years--;months+=12}const birthday=new Date(now.getFullYear(),7,22,13,30),last=birthday>now?new Date(now.getFullYear()-1,7,22,13,30):birthday;let r=now-last,day=Math.floor(r/86400000);r%=86400000;let hour=Math.floor(r/3600000);r%=3600000;let minute=Math.floor(r/60000);$('years').textContent=years;$('months').textContent=months;$('days').textContent=day;$('hours').textContent=String(hour).padStart(2,'0');$('minutes').textContent=String(minute).padStart(2,'0');const pct=now.getSeconds()/60*100;$('fill').style.width=pct+'%';$('secondsLabel').textContent=Math.floor(pct)+'%'}update();setInterval(update,1000)</script><script src="music-player.js"></script></body></html>
