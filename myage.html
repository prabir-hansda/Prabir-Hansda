<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A live age tracker for Prabir Hansda.">
  <title>Prabir Hansda — My Age</title>
  <style>
    :root { --bg:#f5f7fb; --surface:#fff; --text:#101828; --muted:#667085; --line:#e4e7ec; --accent:#635bff; --accent-2:#8b5cf6; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 20% 0%,#e8e6ff 0,transparent 32%),radial-gradient(circle at 100% 30%,#dff7ff 0,transparent 30%),var(--bg); }
    .wrap { width:min(900px,calc(100% - 32px)); margin:auto; }
    header { padding:22px 0; display:flex; justify-content:space-between; align-items:center; }
    a { color:inherit; }
    .brand,.back { text-decoration:none; font-weight:800; }
    .back { color:var(--muted); font-size:14px; }
    main { padding:58px 0 80px; }
    .intro { text-align:center; margin-bottom:34px; }
    .eyebrow { display:inline-block; padding:8px 12px; border-radius:999px; background:#eeecff; color:#5148d8; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.12em; }
    h1 { font-size:clamp(40px,7vw,66px); letter-spacing:-.06em; margin:16px 0 10px; }
    .intro p { color:var(--muted); margin:0; }
    .age-card { background:rgba(255,255,255,.84); border:1px solid rgba(255,255,255,.95); border-radius:32px; padding:clamp(24px,5vw,48px); box-shadow:0 24px 70px rgba(16,24,40,.10); backdrop-filter:blur(14px); }
    .age-number { text-align:center; padding:30px 18px; border-radius:24px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; box-shadow:0 16px 34px rgba(99,91,255,.25); }
    #years { display:block; font-size:clamp(72px,13vw,128px); line-height:.9; font-weight:900; letter-spacing:-.08em; }
    .label { margin-top:14px; font-weight:700; opacity:.88; }
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:16px; }
    .stat { padding:20px 12px; text-align:center; border:1px solid var(--line); border-radius:18px; background:#fff; }
    .value { display:block; font-size:clamp(25px,4vw,38px); font-weight:850; letter-spacing:-.04em; }
    .unit { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.1em; }
    .progress { margin-top:18px; }
    .progress-head { display:flex; justify-content:space-between; color:var(--muted); font-size:12px; margin-bottom:8px; }
    .track { height:10px; background:#eaecf0; border-radius:99px; overflow:hidden; }
    #fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .5s linear; }
    .actions { display:flex; justify-content:center; margin-top:28px; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:0 18px; border-radius:13px; text-decoration:none; font-weight:800; border:1px solid var(--line); background:#fff; }
    .note { text-align:center; color:var(--muted); font-size:13px; margin-top:22px; }
    @media (max-width:620px) { .stats { grid-template-columns:repeat(2,1fr); } main { padding-top:35px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="index.html">PH.</a>
      <a class="back" href="index.html">← Back home</a>
    </header>

    <main>
      <div class="intro">
        <span class="eyebrow">Live age tracker</span>
        <h1>How old am I?</h1>
        <p>My age updates automatically in real time.</p>
      </div>

      <section class="age-card" aria-label="Live age information">
        <div class="age-number">
          <span id="years">00</span>
          <span class="label">years old</span>
        </div>

        <div class="stats">
          <div class="stat"><span id="months" class="value">0</span><span class="unit">months</span></div>
          <div class="stat"><span id="days" class="value">0</span><span class="unit">days</span></div>
          <div class="stat"><span id="hours" class="value">00</span><span class="unit">hours</span></div>
          <div class="stat"><span id="minutes" class="value">00</span><span class="unit">minutes</span></div>
        </div>

        <div class="progress">
          <div class="progress-head"><span>Current minute</span><span id="secondsLabel">0%</span></div>
          <div class="track"><div id="fill"></div></div>
        </div>

        <div class="actions"><a class="button" href="index.html">Return to profile</a></div>
        <p class="note">Birthday: 22 August 2004 · 1:30 PM</p>
      </section>
    </main>
  </div>

  <script>
    const BIRTH_DATE = new Date(2004, 7, 22, 13, 30, 0);
    const $ = id => document.getElementById(id);

    function ageParts(now) {
      let years = now.getFullYear() - BIRTH_DATE.getFullYear();
      let months = now.getMonth() - BIRTH_DATE.getMonth();
      let dayAnchor = new Date(now.getFullYear(), now.getMonth(), BIRTH_DATE.getDate(), BIRTH_DATE.getHours(), BIRTH_DATE.getMinutes(), BIRTH_DATE.getSeconds());
      if (dayAnchor > now) months--;
      if (months < 0) { years--; months += 12; }

      const lastBirthday = new Date(now.getFullYear() - (now < new Date(now.getFullYear(), BIRTH_DATE.getMonth(), BIRTH_DATE.getDate(), BIRTH_DATE.getHours(), BIRTH_DATE.getMinutes(), BIRTH_DATE.getSeconds()) ? 1 : 0), BIRTH_DATE.getMonth(), BIRTH_DATE.getDate(), BIRTH_DATE.getHours(), BIRTH_DATE.getMinutes(), BIRTH_DATE.getSeconds());
      let remainder = now - lastBirthday;
      const day = Math.floor(remainder / 86400000); remainder %= 86400000;
      const hour = Math.floor(remainder / 3600000); remainder %= 3600000;
      const minute = Math.floor(remainder / 60000); remainder %= 60000;
      const second = Math.floor(remainder / 1000);
      return { years, months, day, hour, minute, second };
    }

    function update() {
      const now = new Date();
      const a = ageParts(now);
      $('years').textContent = a.years;
      $('months').textContent = a.months;
      $('days').textContent = a.day;
      $('hours').textContent = String(a.hour).padStart(2, '0');
      $('minutes').textContent = String(a.minute).padStart(2, '0');
      const pct = (now.getSeconds() / 60) * 100;
      $('fill').style.width = pct + '%';
      $('secondsLabel').textContent = Math.floor(pct) + '%';
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
